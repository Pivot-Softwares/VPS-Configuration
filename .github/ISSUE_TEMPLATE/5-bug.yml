name: Bug
description: "Behavior that contradicts agreed expected behavior, under a feature."
title: "Bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Work items follow the Work Management and Delivery Specification (docs/reference/work-management-specification.md, ADR-0001): Epic → Feature → User Story, Improvement, Bug or Spike → Task, and nothing is standalone. Classify by intent first, then scope (section 3). Choose a bug when actual behavior contradicts agreed expected behavior. Its parent is a feature. After creating this issue, add it as a sub-issue of its parent at once. Answer every field; write `Unknown: needs clarification` for what isn't known yet, and such an item stays in Backlog until it is clarified (section 4)."
  - type: input
    id: parent
    attributes:
      label: Parent
      description: "The feature this bug belongs to, for example #2."
      placeholder: "#"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: "Why the defect matters to users or the release."
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: "The agreed behavior, and where it was agreed. If it was never agreed, clarify it before filing a bug."
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: "What happens instead."
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: "Numbered steps that reproduce the defect."
    validations:
      required: true
  - type: textarea
    id: affected-environment
    attributes:
      label: Affected environment
      description: "Where it happens: version, browser, realm, operating system."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "What the fix covers."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: "Restored behavior, including regression coverage."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Prerequisites as #N (also linked as blocked-by), or None. Parents are not dependencies."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: "How the fix and the regression test are verified."
    validations:
      required: true
